# Benchmark set C: v2 config with the ladder on for every split (each page written at damage stages 1 to 5).
# v2 config: same as hindi_sale_deed.yaml plus bundled Google Fonts (printed) and bundled Kalam/Amita for margin notes.
# One config per run. Language and document type are config; code is generic.
language: hi
doc_type: sale_deed
numerals: [latin, devanagari]
seed_base: 0
page:
  sizes: [[1240, 1754], [1240, 1650], [1200, 1800], [1300, 1700], [1100, 1560], [1360, 1760]]   # px, varied per page
  margin_l: [90, 130]
  margin_r: [90, 130]
  margin_t: [40, 80]
  margin_b: [40, 80]
  header_h: [150, 260]     # reserved for header artwork in stage 2
  footer_h: [150, 240]
  sig_h: 130
fonts:                       # system family names (apt: fonts-noto-core fonts-deva-extra fonts-gargi fonts-sarai fonts-nakula fonts-lohit-deva)
  - {family: "Noto Serif Devanagari", weight: 400, p: 0.110}
  - {family: "Noto Serif Devanagari", weight: 500, p: 0.050}
  - {family: "Noto Sans Devanagari", weight: 400, p: 0.060}
  - {family: "Lohit Devanagari", weight: 400, p: 0.060}
  - {family: "Gargi", weight: 400, p: 0.060}
  - {family: "Sarai", weight: 400, p: 0.050}
  - {family: "Nakula", weight: 400, p: 0.040}
  - {family: "Kalimati", weight: 400, p: 0.040}
  - {family: "Samanata", weight: 400, p: 0.030}
  # ---- bundled Google Fonts (SIL OFL). Loaded from assets/fonts with @font-face, nothing to install. `files` maps weight -> file under assets_dir.
  - {family: "Hind", weight: 400, p: 0.07, files: {400: "fonts/hind/Hind-Regular.ttf", 700: "fonts/hind/Hind-Bold.ttf"}}
  - {family: "Mukta", weight: 400, p: 0.06, files: {400: "fonts/mukta/Mukta-Regular.ttf", 700: "fonts/mukta/Mukta-Bold.ttf"}}
  - {family: "Khula", weight: 400, p: 0.04, files: {400: "fonts/khula/Khula-Regular.ttf", 700: "fonts/khula/Khula-Bold.ttf"}}
  - {family: "Palanquin", weight: 400, p: 0.05, files: {400: "fonts/palanquin/Palanquin-Regular.ttf", 700: "fonts/palanquin/Palanquin-Bold.ttf"}}
  - {family: "Sahitya", weight: 400, p: 0.05, files: {400: "fonts/sahitya/Sahitya-Regular.ttf", 700: "fonts/sahitya/Sahitya-Bold.ttf"}}
  - {family: "Martel", weight: 400, p: 0.06, files: {400: "fonts/martel/Martel-Regular.ttf", 700: "fonts/martel/Martel-Bold.ttf"}}
  - {family: "Karma", weight: 400, p: 0.04, files: {400: "fonts/karma/Karma-Regular.ttf", 700: "fonts/karma/Karma-Bold.ttf"}}
  - {family: "Halant", weight: 400, p: 0.03, files: {400: "fonts/halant/Halant-Regular.ttf", 700: "fonts/halant/Halant-Bold.ttf"}}
  - {family: "Laila", weight: 400, p: 0.04, files: {400: "fonts/laila/Laila-Regular.ttf", 700: "fonts/laila/Laila-Bold.ttf"}}
  - {family: "Sumana", weight: 400, p: 0.03, files: {400: "fonts/sumana/Sumana-Regular.ttf", 700: "fonts/sumana/Sumana-Bold.ttf"}}
  - {family: "Tiro Devanagari Hindi", weight: 400, p: 0.03, files: {400: "fonts/tirodevanagarihindi/TiroDevanagariHindi-Regular.ttf"}}
ink:                         # body text colour
  - {color: "#111111", p: 0.45}
  - {color: "#1a1a5e", p: 0.40}   # blue-black
  - {color: "#17338f", p: 0.15}   # blue
size_plan:                   # v2: how large the body text should be. [min px, max px, weight]; the page is then filled at about that size
  fs: [[16, 20, 0.20], [20, 27, 0.35], [27, 34, 0.20], [34, 48, 0.25]]     # the last band is large type
  compact_above: 34          # target sizes from here on use a short-form deed (about 90 words), since the full text cannot be set that large
  line_height: [1.5, 2.0]
page_style: {printed: 0.35, hybrid: 0.30, handwritten: 0.35}     # provisional weights; retuned after the calibration run
handwriting:
  fonts:                     # handwritten-style fonts. weight = the weight used for body text
    - {family: "Kalam", weight: 400, p: 0.40, files: {300: "fonts/kalam/Kalam-Light.ttf", 400: "fonts/kalam/Kalam-Regular.ttf", 700: "fonts/kalam/Kalam-Bold.ttf"}}
    - {family: "Kalam", weight: 300, p: 0.25, files: {300: "fonts/kalam/Kalam-Light.ttf", 400: "fonts/kalam/Kalam-Regular.ttf", 700: "fonts/kalam/Kalam-Bold.ttf"}}
    - {family: "Amita", weight: 400, p: 0.35, files: {400: "fonts/amita/Amita-Regular.ttf", 700: "fonts/amita/Amita-Bold.ttf"}}
  ink:
    - {color: "#1a1a5e", p: 0.40}
    - {color: "#17338f", p: 0.30}
    - {color: "#111111", p: 0.20}
    - {color: "#0b2a6f", p: 0.10}
  jitter: {angle_deg: 1.1, dy_em: 0.035, scale: 0.05, alpha: [0.82, 1.0], skew_deg: 2.5, gap_em: 0.14, line_dy_em: 0.03, line_angle_deg: 0.5}   # per word, plus one wobble per line
  messy: [0.7, 1.9]          # per page: how untidy the writer is (multiplies the jitter)
  ink_spread: [0.0, 0.7]     # px of soft glow around the strokes (pen ink bleeding)
  hybrid_facts: [date, khasra, area, amount_text, amount_words, stamp_duty, seller, buyer, seller_relative, buyer_relative, witnesses]
  hybrid_digits: true        # any word that contains a digit is also written by hand in hybrid pages
  fs: [[22, 28, 0.30], [28, 36, 0.30], [36, 48, 0.40]]    # body size bands (px) for fully handwritten pages
align: {justify: 0.8, left: 0.2}
writer:
  kind: template              # template | gemini
  model: gemini-3.8-flash     # as named in the original notebook; unverified
  concurrency: 32
  cache_dir: cache/text
fit: {fill_lo: 0.90, fill_hi: 0.965, max_attempts: 4}
assets_dir: assets
compose:                      # stage 2 probabilities (defaults live in compose.py)
  header_mode: {banner: 0.6, letterhead: 0.25, none: 0.15}
  footer_mode: {endorsement: 0.5, line: 0.2, none: 0.3}
  p_overlap_text: 0.45
  p_text_stamp: 0.65
  marks: [2, 5]
  notes: [0, 3]
note_font_files:             # v2: handwriting-style fonts used for margin notes (same names as `note_fonts`), loaded from assets/fonts
  Kalam: {300: "fonts/kalam/Kalam-Light.ttf", 400: "fonts/kalam/Kalam-Regular.ttf", 700: "fonts/kalam/Kalam-Bold.ttf"}
  Amita: {400: "fonts/amita/Amita-Regular.ttf", 700: "fonts/amita/Amita-Bold.ttf"}
skip_assets: []              # asset file stems to leave out, e.g. [stamp1, stamp2] for the stamps that carry 2023 dates

degrade:                     # stage 3, always last
  enabled: true
  paired: true               # also save an aligned clean target (same geometry, no damage)
  use_augraphy: true
  format: png                # png | jpg (jpg applies the sampled JPEG quality)
  severity: {light: 0.3, medium: 0.45, heavy: 0.25}
  guardrails: {provisional: true, min_text_contrast: 20, max_occluded_frac: 0.6, min_sharpness_ratio: 0.01}   # provisional limits, measured and logged only. After calibration set the limits from calibrated_difficulty.yaml and add `enforce: true`: a page past a limit is redone one stage lower
  staged:                    # v2: damage in five nested stages (1 scan wear, 2 paper ageing, 3 ink damage, 4 geometry/physical, 5 severe)
    enabled: true
    stage_weights: {1: 0.10, 2: 0.15, 3: 0.25, 4: 0.30, 5: 0.20}     # provisional; retuned after calibration. `severity` above is ignored in staged mode
    ladder: {enabled: true, splits: [train, val, test]}   # true: pages in these splits are written five times (stages 1-5, same layout and same damage recipe)

export:                      # stage 4
  out_dir: out/dataset
  split: {train: 0.9, val: 0.05, test: 0.05}   # deterministic from the seed, so re-runs and extensions never reshuffle
  keep_full_record: false    # true also saves the full per-page JSON (entities, lines, slots)

difficulty:                  # easy / medium / hard label written into every v2 label. PROVISIONAL until tools/calibrate.py has been run on real OCR results
  enabled: true
  provisional: true
  version: 1
  weights: {stage: 0.25, contrast: 0.20, sharpness: 0.15, occlusion: 0.15, handwriting: 0.12, small_text: 0.08, font: 0.05}
  thresholds: {easy_max: 0.22, medium_max: 0.46}
  font_difficulty: {Amita: 0.5, Kalam: 0.3, "Tiro Devanagari Hindi": 0.15}
  small_text_px: 22
